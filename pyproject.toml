[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot"
version = "0.1.0"
description = "Latency-arbitrage trading bot framework for Polymarket (paper-trading by default)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PolyBot" }]
dependencies = []  # core runs on the standard library only

[project.optional-dependencies]
# Live trading + websocket streaming + AI brain. None required for paper/backtest.
# py-clob-client must be recent — Polymarket rejects orders built by old clients
# ("invalid order version, please use the latest clob-client").
live = ["py-clob-client>=0.34.0", "websockets>=12.0"]
ai = ["anthropic>=0.39.0"]
dev = ["pytest>=8.0"]

[project.scripts]
polybot = "polybot.cli:main"

[tool.setuptools.packages.find]
include = ["polybot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
